# Test de la voix clonee : genere une phrase anglaise en deux styles et la publie dans la release voix-test
name: voix-test

on:
  workflow_dispatch:
    inputs:
      text:
        description: Texte anglais a lire
        default: "No way! Rockstar just hid a secret car in GTA 6, and almost nobody has found it yet. Here's exactly where it is!"

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TEXT: ${{ inputs.text }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Installer Chatterbox (torch CPU)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7
      - name: Dechiffrer l'echantillon
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICE_KEY -in voix/ref.wav.enc -out "$RUNNER_TEMP/ref.wav"
      - name: Generer
        # TEXT passe en argument, jamais interprete par le shell
        run: python voix.py "$RUNNER_TEMP/ref.wav" test "$TEXT"
      - name: Publier
        run: |
          gh release view voix-test >/dev/null 2>&1 || gh release create voix-test --title voix-test --notes "Tests de voix off"
          gh release upload voix-test test_*.wav --clobber
