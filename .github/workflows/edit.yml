# Editeur du clippeur maison : refait un short depuis son extrait brut avec les reglages du site
name: edit
run-name: edit ${{ inputs.job_id }} ${{ inputs.clip }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identifiant du travail
        required: true
      clip:
        description: Numero du short (1 a 6)
        required: true
      out:
        description: Identifiant de cette version
        required: true
      spec:
        description: Reglages JSON de l'editeur
        default: "{}"

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # voix off : ~10 min de calcul par short
    env:
      GH_TOKEN: ${{ github.token }}
      JOB: ${{ inputs.job_id }}
      CLIP: ${{ inputs.clip }}
      OUT: ${{ inputs.out }}
      SPEC: ${{ inputs.spec }}
    steps:
      - name: Verifier les entrees
        run: |
          [[ "$JOB" =~ ^[a-f0-9]{16}$ ]] || { echo "job_id invalide"; exit 1; }
          [[ "$CLIP" =~ ^[1-6]$ ]] || { echo "clip invalide"; exit 1; }
          [[ "$OUT" =~ ^[a-f0-9]{8}$ ]] || { echo "out invalide"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q opencv-python-headless numpy pillow
      - uses: actions/cache@v4
        if: fromJSON(inputs.spec).voice == true
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Voix off (Chatterbox + echantillon chiffre de Jacques)
        if: fromJSON(inputs.spec).voice == true
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        # chatterbox impose numpy<2 : opencv 4.10 est le dernier qui l'accepte
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 opencv-python-headless==4.10.0.84
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:VOICE_KEY -in voix/ref.wav.enc -out "$RUNNER_TEMP/ref.wav"
          echo "VOICE_REF=$RUNNER_TEMP/ref.wav" >> "$GITHUB_ENV"
      - name: Recuperer l'extrait
        run: gh release download "job-$JOB" -p "raw_0$CLIP.mp4" -p shorts.json -D in
      - name: Monter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # SPEC est relu et valide par clip.py (parse_spec), jamais interprete par le shell
        run: python clip.py --edit "$CLIP" --meta in/shorts.json --raw "in/raw_0$CLIP.mp4" --edit-out "edit_0${CLIP}_$OUT.mp4"
      - name: Publier
        run: gh release upload "job-$JOB" "edit_0${CLIP}_$OUT.mp4" "edit_0${CLIP}_$OUT.json" --clobber
      - name: Signaler l'echec
        if: failure()
        run: |
          echo "echec de l'edition" > "edit_0${CLIP}_$OUT.err"
          gh release upload "job-$JOB" "edit_0${CLIP}_$OUT.err" --clobber
