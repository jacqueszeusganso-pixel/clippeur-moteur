# Moteur du clippeur maison : video envoyee depuis le site -> shorts ranges dans la release du travail
name: clip
run-name: clip ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identifiant du travail
        required: true
      clips:
        description: Nombre de shorts
        default: "3"

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      JOB: ${{ inputs.job_id }}
      N: ${{ inputs.clips }}
    steps:
      - name: Verifier les entrees
        run: |
          [[ "$N" =~ ^[1-6]$ ]] || { echo "clips invalide"; exit 1; }
          [[ "$JOB" =~ ^[a-f0-9]{16}$ ]] || { echo "job_id invalide"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q opencv-python-headless numpy
      - name: Recuperer la video
        run: |
          gh release download "job-$JOB" -p 'part_*' -D parts
          cat parts/part_* > input.mp4
          ls -lh input.mp4
      - name: Clipper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python clip.py input.mp4 --clips "$N" --out sorties
      - name: Publier les shorts
        run: |
          d=$(ls -d sorties/video_* | head -1)
          gh release upload "job-$JOB" "$d"/*.mp4 "$d"/shorts.json --clobber
      - name: Signaler l'echec
        if: failure()
        run: |
          echo "echec du moteur" > error.txt
          gh release upload "job-$JOB" error.txt --clobber
      - name: Effacer la video source
        if: always()
        run: |
          gh release view "job-$JOB" --json assets -q '.assets[].name' | grep '^part_' |
            while read -r a; do gh release delete-asset "job-$JOB" "$a" -y; done || true
