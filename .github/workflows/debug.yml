name: debug-synchro
# temporaire : verifier la synchro son/image du vrai rendu sur le serveur (a supprimer)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu && pip install -q opencv-python-headless numpy pillow
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download job-d8e55c7d3929da3a -R ${{ github.repository }} -p raw_01.mp4 -p shorts.json
          python - <<'PY'
          import json, pathlib, clip
          m = json.load(open("shorts.json", encoding="utf-8"))[0]
          words = [{"word": w, "start": a, "end": b} for w, a, b in m["words"]]
          out = pathlib.Path("t.mp4").resolve()
          clip.render_spec(pathlib.Path("raw_01.mp4"), words, clip.parse_spec(m["spec"], 109.3), out, None)
          print("SYNCHRO", clip.check_sync(out))
          PY
